
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>encryptfs | Secure File Sharing</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1120;
            color: #f1f5f9;
        }

        nav {
            background: #111b2e;
            border-bottom: 1px solid #263449;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            color: #60a5fa;
            text-decoration: none;
        }

        main {
            max-width: 1000px;
            margin: 55px auto;
            padding: 0 20px;
        }

        .card {
            background: #172338;
            border: 1px solid #2b3d55;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        input, button {
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
        }

        input {
            width: 100%;
            margin: 8px 0 18px;
            color: white;
            background: #0f172a;
            border: 1px solid #475569;
        }

        button, .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        button:hover, .btn:hover {
            background: #1d4ed8;
        }

        a { color: #93c5fd; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 14px;
            border-bottom: 1px solid #334155;
        }

        .errorlist { color: #fca5a5; }

        .nav-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'dashboard' %}" class="brand">
            🔒 encryptfs
        </a>

        {% if user.is_authenticated %}
        <div class="nav-actions">
            <span>{{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        </div>
        {% endif %}
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
